<svg width="100%" viewBox="0 0 860 40" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&amp;display=swap');

      .glass-bar {
        fill: #ffffff;
        fill-opacity: 0.02;
        stroke: #ffffff;
        stroke-opacity: 0.06;
        stroke-width: 1;
        rx: 8px;
      }

      .tk-txt {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 1.5px;
      }

      .scroll-container {
        animation: tickerScroll 50s linear infinite;
      }

      @keyframes tickerScroll {
        from {
          transform: translateX(0);
        }

        to {
          transform: translateX(-1840px);
        }
      }

      .fade-left {
        fill: url(#leftGrad);
      }

      .fade-right {
        fill: url(#rightGrad);
      }
    </style>


    <!-- Text Gradient -->
    <linearGradient
      id="tickerGrad"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop offset="0%" stop-color="#8f8f8f"/>
      <stop offset="25%" stop-color="#bebebe"/>
      <stop offset="50%" stop-color="#e6e6e6"/>
      <stop offset="75%" stop-color="#d3d3d3"/>
      <stop offset="100%" stop-color="#f5f5f6"/>
    </linearGradient>


    <!-- Ticker Clip -->
    <clipPath id="tickerClip">
      <rect
        x="0"
        y="2"
        width="860"
        height="36"
      />
    </clipPath>


    <!-- Left Fade -->
    <linearGradient
      id="leftGrad"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop
        offset="0%"
        stop-color="#020205"
        stop-opacity="1"
      />

      <stop
        offset="100%"
        stop-color="#020205"
        stop-opacity="0"
      />
    </linearGradient>


    <!-- Right Fade -->
    <linearGradient
      id="rightGrad"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop
        offset="0%"
        stop-color="#020205"
        stop-opacity="0"
      />

      <stop
        offset="100%"
        stop-color="#020205"
        stop-opacity="1"
      />
    </linearGradient>

  </defs>


  <!-- Glass Background -->
  <rect
    x="5"
    y="2"
    width="850"
    height="36"
    class="glass-bar"
  />


  <!-- Scrolling Area -->
  <g clip-path="url(#tickerClip)">

    <g class="scroll-container">


      <!-- FIRST TEXT -->
      <text
        x="120"
        y="23"
        class="tk-txt"
        fill="url(#tickerGrad)"
        textLength="1800"
        lengthAdjust="spacing"
      >
        COMPUTER SCIENCE AND ENGINEERING STUDENT WITH A SOLID FOUNDATION IN SOFTWARE DEVELOPMENT, DRIVEN BY CURIOSITY AND A PASSION FOR LEARNING AND EXPLORING NEW TECHNOLOGIES.
      </text>


      <!-- SECOND TEXT -->
      <!-- 40px gap + 1800px text -->
      <text
        x="2000"
        y="23"
        class="tk-txt"
        fill="url(#tickerGrad)"
        textLength="1800"
        lengthAdjust="spacing"
      >
        COMPUTER SCIENCE AND ENGINEERING STUDENT WITH A SOLID FOUNDATION IN SOFTWARE DEVELOPMENT, DRIVEN BY CURIOSITY AND A PASSION FOR LEARNING AND EXPLORING NEW TECHNOLOGIES.
      </text>


    </g>


    <!-- Left Fade -->
    <rect
      x="0"
      y="2"
      width="45"
      height="36"
      class="fade-left"
    />


    <!-- Right Fade -->
    <rect
      x="815"
      y="2"
      width="45"
      height="36"
      class="fade-right"
    />

  </g>

</svg>